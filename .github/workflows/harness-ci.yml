name: Harness Code CI

# Runs on every pull request and on demand. Lint, unit tests, the debug and
# release APKs, and the artefacts a reviewer needs (APKs + test reports).
# The screenshots are produced by the instrumented test sources in
# app/src/androidTest; that job needs an emulator and is opt-in via the
# `ui-tests` label or manual dispatch, so an ordinary PR stays fast.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_ui_tests:
        description: "Also run the instrumented Compose UI tests on an emulator"
        type: boolean
        default: false
      make_release:
        description: "Publish a pre-release with the APKs from this run"
        type: boolean
        default: false

permissions:
  contents: read
  # The optional release step pushes a tag and uploads the APKs.
  actions: read

concurrency:
  group: harness-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v6

      # AGP refuses to configure with the pinned NDK missing.
      - name: Install pinned NDK
        run: "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager --install 'ndk;27.2.12479018'"

      - name: Install Vulkan shader compiler
        run: sudo apt-get update && sudo apt-get install -y glslc

      # Each step tees its output to ci-out/logs: the runner's own log blob is
      # not always reachable, so failures are mirrored to annotations and to
      # uploaded files.
      - name: Unit tests, debug APK
        run: |
          mkdir -p ci-out/logs
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --continue --no-daemon --stacktrace 2>&1 | tee ci-out/logs/test-and-debug.log

      # Lint is reported, not gated: the toolchain's lint crashes inside its own
      # JavaDoc parser on this codebase (see app/build.gradle.kts), so a failing
      # lint task does not mean a lint finding. The findings themselves are
      # summarised from the text report in the next step.
      - name: Lint (debug variant)
        if: always()
        continue-on-error: true
        run: |
          mkdir -p ci-out/logs
          set -o pipefail
          ./gradlew :app:lintDebug --no-daemon --stacktrace 2>&1 | tee ci-out/logs/lint.log

      - name: Report lint findings
        if: always()
        run: |
          report=app/build/reports/lint-results-debug.txt
          if [ ! -f "$report" ]; then
            echo "::notice::Lint produced no text report (the task failed before writing one)."
            exit 0
          fi
          errors=$(grep -cE ": Error: " "$report" || true)
          warnings=$(grep -cE ": Warning: " "$report" || true)
          new=$(grep -E ": Error: " "$report" | grep -cE "ui/harness|WorktreeManager|WorktreeTool|PullRequestMonitor|agent/session" || true)
          echo "::notice::Lint: ${errors} error(s), ${warnings} warning(s); ${new} in files added by this fork."
          grep -E ": Error: " "$report" | sed -n '1,10p' | while IFS= read -r line; do
            echo "::warning::${line:0:900}"
          done
          if [ "${new}" != "0" ]; then
            echo "::error::Lint reports ${new} error(s) in files added by this fork."
            grep -E ": Error: " "$report" | grep -E "ui/harness|WorktreeManager|WorktreeTool|PullRequestMonitor|agent/session" | sed -n '1,8p' | while IFS= read -r line; do
              echo "::error::${line:0:900}"
            done
          fi

      - name: Assemble release APK
        if: always()
        env:
          HARNESS_KEYSTORE_BASE64: ${{ secrets.HARNESS_KEYSTORE_BASE64 }}
          HARNESS_KEYSTORE_PASSWORD: ${{ secrets.HARNESS_KEYSTORE_PASSWORD }}
          HARNESS_KEY_ALIAS: ${{ secrets.HARNESS_KEY_ALIAS }}
          HARNESS_KEY_PASSWORD: ${{ secrets.HARNESS_KEY_PASSWORD }}
        run: |
          mkdir -p ci-out/logs
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee ci-out/logs/assemble-release.log

      # Facts that are otherwise only visible inside the runner: test totals
      # and the APKs that actually exist.
      - name: Report build facts
        if: always()
        run: |
          count() {
            grep -ho "$1=\"[0-9]*\"" app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null \
              | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}'
          }
          if [ -d app/build/test-results/testDebugUnitTest ]; then
            echo "::notice::Unit tests: $(count tests) run, $(count failures) failed, $(count errors) errors, $(count skipped) skipped."
            echo "::notice::New harness suites present: $(ls app/build/test-results/testDebugUnitTest | grep -cE 'Harness|SessionGrouping|WorktreeCommand|FixFailingChecks')"
          else
            echo "::warning::No unit test results were produced."
          fi
          found=0
          for f in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            [ -f "$f" ] || continue
            found=1
            echo "::notice::APK $(basename "$f") $(du -h "$f" | cut -f1)"
          done
          [ "$found" = 1 ] || echo "::warning::No APKs were produced."

      - name: Name artefacts by signing state
        if: always()
        run: |
          mkdir -p ci-out
          label="test-signed"
          if [ -n "${{ secrets.HARNESS_KEYSTORE_BASE64 }}" ]; then label="signed"; fi
          for f in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            [ -f "$f" ] || continue
            cp "$f" "ci-out/harness-code-$(basename "$f" .apk)-${label}-${GITHUB_SHA::7}.apk"
          done
          ls -l ci-out || true

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-code-apks
          path: ci-out/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Surface build errors (slice 1)
        if: always()
        run: |
          shopt -s nullglob
          cat ci-out/logs/*.log 2>/dev/null | grep -E "^e: |error:|Execution failed|What went wrong" | sed -n '1,10p' | while IFS= read -r line; do
            text="${line//'%'/'%25'}"
            text="${text//$'\n'/'%0A'}"
            text="${text//$'\r'/'%0D'}"
            echo "::error::${text:0:900}"
          done

      - name: Surface build errors (slice 2)
        if: always()
        run: |
          shopt -s nullglob
          cat ci-out/logs/*.log 2>/dev/null | grep -E "^e: |error:|Execution failed|What went wrong" | sed -n '11,20p' | while IFS= read -r line; do
            text="${line//'%'/'%25'}"
            text="${text//$'\n'/'%0A'}"
            text="${text//$'\r'/'%0D'}"
            echo "::error::${text:0:900}"
          done

      - name: Surface build errors (slice 3)
        if: always()
        run: |
          shopt -s nullglob
          cat ci-out/logs/*.log 2>/dev/null | grep -E "^e: |error:|Execution failed|What went wrong" | sed -n '21,30p' | while IFS= read -r line; do
            text="${line//'%'/'%25'}"
            text="${text//$'\n'/'%0A'}"
            text="${text//$'\r'/'%0D'}"
            echo "::error::${text:0:900}"
          done

      - name: Surface build errors (slice 4)
        if: always()
        run: |
          shopt -s nullglob
          cat ci-out/logs/*.log 2>/dev/null | grep -E "^e: |error:|Execution failed|What went wrong" | sed -n '31,40p' | while IFS= read -r line; do
            text="${line//'%'/'%25'}"
            text="${text//$'\n'/'%0A'}"
            text="${text//$'\r'/'%0D'}"
            echo "::error::${text:0:900}"
          done

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: ci-out/logs
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          retention-days: 14

  release:
    name: Pre-release with APKs
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.make_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download APKs
        uses: actions/download-artifact@v6
        with:
          name: harness-code-apks
          path: apks

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l apks
          notes="docs/harness-code/RELEASE_NOTES.md"
          if gh release view harness-code-v1.0.0 >/dev/null 2>&1; then
            gh release upload harness-code-v1.0.0 apks/*.apk --clobber
          else
            gh release create harness-code-v1.0.0 apks/*.apk \
              --target "$GITHUB_SHA" \
              --title "Harness Code 1.0.0 (pre-release)" \
              --notes-file "$notes" \
              --prerelease
          fi

  ui-tests:
    name: Compose UI tests (emulator)
    if: github.event_name == 'workflow_dispatch' && inputs.run_ui_tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v6

      - name: Install pinned NDK
        run: "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager --install 'ndk;27.2.12479018'"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests and pull screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            mkdir -p ci-screens
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace || STATUS=$?
            adb shell run-as com.harnesscode.app.debug ls /sdcard/Download 2>/dev/null || true
            adb pull /sdcard/Download ci-screens 2>/dev/null || true
            exit ${STATUS:-0}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots
          path: ci-screens
          if-no-files-found: warn
          retention-days: 30
